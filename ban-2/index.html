<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SWAP – Style With A Purpose</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Thanh trên cùng: được vẽ bằng js/app.js (hàm renderHeader) từ nội dung trong js/site-config.js -->
  <header class="topbar" id="hdr"></header>

  <main id="app" class="container"></main>

  <!-- Chân trang: được vẽ từ phần "footer" trong js/site-config.js -->
  <footer class="footer" id="ftr"></footer>

  <div id="modal"></div>
  <div id="toast" class="toast"></div>

  <!-- Thứ tự nạp quan trọng: cấu hình -> dữ liệu giả -> api -> app -->
  <script src="js/site-config.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
